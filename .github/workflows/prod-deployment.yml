name: prod-deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: prod-deployment
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required site files exist
        run: |
          required_files=(index.html register.html leaderboard.html credits.html style.css)
          missing=0
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "All required site files are present."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  report-build-status:
    name: report-build-status
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write build summary
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "### ✅ Build succeeded" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Result: \`${{ needs.build.result }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set commit status
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ needs.build.result }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'prod-deployment/build',
              description: state === 'success' ? 'Build passed' : 'Build failed',
            });

      - name: Stop workflow if build failed
        if: needs.build.result != 'success'
        run: |
          echo "::error::Build job did not succeed, stopping before deploy."
          exit 1

  deploy:
    name: deploy
    needs: report-build-status
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
